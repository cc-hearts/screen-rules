name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g. 0.0.1)'
        required: true
        default: '0.0.1'

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: macos-14
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Determine Version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            RAW_VER="${{ github.event.inputs.version }}"
          else
            RAW_VER="${GITHUB_REF_NAME#v}"
          fi
          echo "VERSION=${RAW_VER}" >> $GITHUB_ENV
          echo "TAG_NAME=v${RAW_VER}" >> $GITHUB_ENV
          echo "Building version ${RAW_VER}"

      - name: Package Universal App (DMG & ZIP)
        run: |
          chmod +x scripts/package.sh
          ./scripts/package.sh "${{ env.VERSION }}"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: "ScreenRules v${{ env.VERSION }}"
          tag_name: "${{ env.TAG_NAME }}"
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            ScreenRules-${{ env.VERSION }}.dmg
            ScreenRules-${{ env.VERSION }}.zip
            ScreenRules-${{ env.VERSION }}-sha256.txt
